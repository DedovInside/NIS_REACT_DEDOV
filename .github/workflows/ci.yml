name: CI

on:
  push:
    branches: [main, master, HW_1, HW_3]
  pull_request:
    branches: [main, master, HW_1, HW_3]

jobs:
  ci-hw1:
    name: Lint, Format, Test & Build (HW_1)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: HW_1/movie-catalog

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: HW_1/movie-catalog/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Check Prettier formatting
        run: npm run format:check

      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report-hw1
          path: HW_1/movie-catalog/coverage/
          retention-days: 7

      - name: Build
        run: npm run build

  ci-hw3:
    name: Lint, Format, Test & Build (HW_3)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: HW_3/e-commerce-admin

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: HW_3/e-commerce-admin/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Check Prettier formatting
        run: npm run format:check

      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report-hw3
          path: HW_3/e-commerce-admin/coverage/
          retention-days: 7

      - name: Build
        run: npm run build
